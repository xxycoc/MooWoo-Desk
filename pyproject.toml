[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moowoo"
version = "0.1.0"
description = "Append-only event ledger for MooWoo Desk paper trading"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pandas>=3.0,<4", "numpy>=2.5,<3", "yfinance>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["moowoo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
